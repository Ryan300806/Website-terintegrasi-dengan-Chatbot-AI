
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Kedai Kopi</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="login-page">

    <main class="login-container">

        <!-- Login Showcase -->
        <section class="login-showcase">

            <div class="login-showcase-content">

                <div class="login-brand">
                    <i class="bi bi-cup-hot-fill"></i>
                    <span>Kedai Kopi</span>
                </div>

                <div class="login-welcome">
                    <span class="login-label">
                        MANAGEMENT SYSTEM
                    </span>

                    <h1>
                        Kelola Kedai Kopi
                        Lebih Mudah.
                    </h1>

                    <p>
                        Sistem informasi untuk membantu
                        pengelolaan produk, transaksi,
                        pengguna, dan laporan penjualan.
                    </p>
                </div>

                <div class="login-showcase-footer">
                    <span>
                        <i class="bi bi-shield-check"></i>
                        Sistem Pengelolaan Terintegrasi
                    </span>
                </div>

            </div>

        </section>

        <!-- Login Form -->
        <section class="login-panel">

            <div class="login-form-wrapper">

                <div class="login-form-heading">

                    <div class="login-mobile-brand">
                        <i class="bi bi-cup-hot-fill"></i>
                        Kedai Kopi
                    </div>

                    <h2>Selamat Datang!</h2>

                    <p>
                        Silakan masuk menggunakan akun Anda.
                    </p>

                </div>

                <!-- Alert -->
                <div
                    id="loginAlert"
                    class="alert d-none"
                    role="alert"
                ></div>

                <!-- Form -->
                <form id="loginForm">

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Masukkan username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-4">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Masukkan password"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                    </div>

                    <button
                        type="submit"
                        id="loginButton"
                        class="btn btn-primary w-100"
                    >
                        Masuk
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </form>

                <div class="login-footer">
                    <p>
                        &copy; 2026 Kedai Kopi.
                        All rights reserved.
                    </p>
                </div>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Configuration -->
    <script src="../js/config/apiConfig.js"></script>

    <!-- Services -->
    <script src="../js/services/apiService.js"></script>
    <script src="../js/services/authService.js"></script>

    <!-- Utils -->
    <script src="../js/utils/authGuard.js"></script>

    <!-- Components -->
    <script src="../js/components/notification.js"></script>

    <!-- Page Script -->
    <script src="../js/pages/login.js"></script>

</body>
</html>
