
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manajemen Kategori | Kedai Kopi</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Navbar -->
            <div id="navbar-container"></div>

            <!-- Categories Content -->
            <section class="page-content">

                <!-- Page Header -->
                <div class="page-header">

                    <div>
                        <h1>Manajemen Kategori</h1>

                        <p>
                            Kelola pengelompokan produk
                            yang tersedia di Kedai Kopi.
                        </p>
                    </div>

                    <button
                        type="button"
                        id="categoryAddButton"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-plus-lg me-2"></i>
                        Tambah Kategori
                    </button>

                </div>

                <!-- Category Information -->
                <div class="category-summary">

                    <div class="stat-card">

                        <div class="stat-card-icon">
                            <i class="bi bi-tags"></i>
                        </div>

                        <div class="stat-card-content">
                            <span>Total Kategori</span>

                            <h3 id="totalCategories">0</h3>
                        </div>

                    </div>

                </div>

                <!-- Category Table -->
                <div class="card category-table-card">

                    <div class="card-header">

                        <div>
                            <h5>Daftar Kategori</h5>

                            <p>
                                Daftar kategori produk
                                yang terdaftar dalam sistem.
                            </p>
                        </div>

                    </div>

                    <div class="table-responsive">

                        <table class="table align-middle">

                            <thead>
                                <tr>
                                    <th>Nama Kategori</th>
                                    <th>Deskripsi</th>
                                    <th>Jumlah Produk</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>

                            <tbody id="categoryTableBody">

                                <tr>
                                    <td colspan="4" class="text-center">
                                        Memuat data kategori...
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Add / Edit Category Modal -->
    <div
        class="modal fade"
        id="categoryModal"
        tabindex="-1"
        aria-labelledby="categoryModalTitle"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="categoryModalTitle"
                    >
                        Tambah Kategori
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Tutup"
                    ></button>

                </div>

                <!-- Modal Body -->
                <div class="modal-body">

                    <form id="categoryForm">

                        <!-- Hidden Category ID -->
                        <input
                            type="hidden"
                            id="categoryId"
                        >

                        <!-- Category Name -->
                        <div class="mb-3">

                            <label
                                for="categoryName"
                                class="form-label"
                            >
                                Nama Kategori
                            </label>

                            <input
                                type="text"
                                id="categoryName"
                                class="form-control"
                                placeholder="Contoh: Kopi"
                                maxlength="100"
                                required
                            >

                        </div>

                        <!-- Category Description -->
                        <div class="mb-3">

                            <label
                                for="categoryDescription"
                                class="form-label"
                            >
                                Deskripsi
                            </label>

                            <textarea
                                id="categoryDescription"
                                class="form-control"
                                rows="4"
                                placeholder="Masukkan deskripsi kategori..."
                            ></textarea>

                        </div>

                    </form>

                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        form="categoryForm"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-save me-2"></i>
                        Simpan Kategori
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Configuration -->
    <script src="../js/config/apiConfig.js"></script>

    <!-- Services -->
    <script src="../js/services/apiService.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/services/categoryService.js"></script>

    <!-- Utils -->
    <script src="../js/utils/authGuard.js"></script>
    <script src="../js/utils/formatCurrency.js"></script>
    <script src="../js/utils/formatDate.js"></script>
    <script src="../js/utils/validation.js"></script>

    <!-- Components -->
    <script src="../js/components/notification.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/navbar.js"></script>

    <!-- Page Script -->
    <script src="../js/pages/categories.js"></script>

</body>
</html>
