
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manajemen Produk | Kedai Kopi</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Navbar -->
            <div id="navbar-container"></div>

            <!-- Product Page -->
            <section class="page-content">

                <!-- Page Header -->
                <div class="page-header">

                    <div>
                        <h1>Manajemen Produk</h1>

                        <p>
                            Kelola seluruh produk yang tersedia
                            di Kedai Kopi.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="productAddButton"
                        onclick="openProductForm()"
                    >
                        <i class="bi bi-plus-lg me-2"></i>
                        Tambah Produk
                    </button>

                </div>

                <!-- Product Toolbar -->
                <div class="product-toolbar">

                    <!-- Search -->
                    <div class="product-search">

                        <i class="bi bi-search"></i>

                        <input
                            type="search"
                            id="productSearch"
                            class="form-control"
                            placeholder="Cari nama produk..."
                        >

                    </div>

                    <!-- Category Filter -->
                    <div class="product-filter">

                        <select
                            id="productCategoryFilter"
                            class="form-select"
                        >
                            <option value="">Semua Kategori</option>
                        </select>

                    </div>

                    <!-- Status Filter -->
                    <div class="product-filter">

                        <select
                            id="productStatusFilter"
                            class="form-select"
                        >
                            <option value="">Semua Status</option>
                            <option value="active">Aktif</option>
                            <option value="inactive">Nonaktif</option>
                        </select>

                    </div>

                </div>

                <!-- Product Table Card -->
                <div class="card product-table-card">

                    <div class="card-header">

                        <div>
                            <h5>Daftar Produk</h5>

                            <p>
                                Informasi produk yang tersedia
                                dalam sistem.
                            </p>
                        </div>

                    </div>

                    <div class="table-responsive">

                        <table class="table align-middle">

                            <thead>
                                <tr>
                                    <th>Nama Produk</th>
                                    <th>Kategori</th>
                                    <th>Harga</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>

                            <tbody id="productTableBody">

                                <tr>
                                    <td colspan="5" class="text-center">
                                        Memuat data produk...
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Add / Edit Product Modal -->
    <div
        class="modal fade"
        id="productModal"
        tabindex="-1"
        aria-labelledby="productModalTitle"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="productModalTitle"
                    >
                        Tambah Produk
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Tutup"
                    ></button>

                </div>

                <!-- Modal Body -->
                <div class="modal-body">

                    <form id="productForm">

                        <!-- Hidden Product ID -->
                        <input
                            type="hidden"
                            id="productId"
                        >

                        <!-- Product Name -->
                        <div class="mb-3">

                            <label
                                for="productName"
                                class="form-label"
                            >
                                Nama Produk
                            </label>

                            <input
                                type="text"
                                id="productName"
                                class="form-control"
                                placeholder="Contoh: Kopi Susu"
                                maxlength="100"
                                required
                            >

                        </div>

                        <!-- Category -->
                        <div class="mb-3">

                            <label
                                for="productCategory"
                                class="form-label"
                            >
                                Kategori
                            </label>

                            <select
                                id="productCategory"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Pilih kategori
                                </option>
                            </select>

                        </div>

                        <!-- Price -->
                        <div class="mb-3">

                            <label
                                for="productPrice"
                                class="form-label"
                            >
                                Harga Produk (Rp)
                            </label>

                            <input
                                type="number"
                                id="productPrice"
                                class="form-control"
                                placeholder="Contoh: 15000"
                                min="1"
                                step="1"
                                required
                            >

                        </div>

                        <!-- Description -->
                        <div class="mb-3">

                            <label
                                for="productDescription"
                                class="form-label"
                            >
                                Deskripsi
                            </label>

                            <textarea
                                id="productDescription"
                                class="form-control"
                                rows="3"
                                placeholder="Deskripsi singkat produk..."
                            ></textarea>

                        </div>

                    </form>

                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        form="productForm"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-save me-2"></i>
                        Simpan Produk
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Configuration -->
    <script src="../js/config/apiConfig.js"></script>

    <!-- Services -->
    <script src="../js/services/apiService.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/services/categoryService.js"></script>
    <script src="../js/services/productService.js"></script>

    <!-- Utils -->
    <script src="../js/utils/authGuard.js"></script>
    <script src="../js/utils/formatCurrency.js"></script>
    <script src="../js/utils/formatDate.js"></script>
    <script src="../js/utils/validation.js"></script>

    <!-- Components -->
    <script src="../js/components/notification.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/navbar.js"></script>

    <!-- Page Script -->
    <script src="../js/pages/products.js"></script>

</body>
</html>
