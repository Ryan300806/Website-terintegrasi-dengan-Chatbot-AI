
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Sistem Informasi Asisten Bisnis Kedai Kopi untuk membantu pengelolaan produk, transaksi, pengguna, dan laporan penjualan."
    >

    <meta name="theme-color" content="#35251F">

    <title>Kedai Kopi | Sistem Informasi</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F7F4EF;
            font-family: Inter, "Segoe UI", sans-serif;
        }

        .loading-container {
            text-align: center;
            padding: 32px;
        }

        .loading-icon {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #35251F;
            color: #FFFFFF;
            font-size: 28px;
        }

        .loading-title {
            color: #292524;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .loading-description {
            color: #78716C;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #E7E1DA;
            border-top-color: #A66B45;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .loading-error {
            display: none;
            color: #DC2626;
            font-size: 14px;
            margin-top: 16px;
        }

        .loading-error a {
            color: #A66B45;
            font-weight: 600;
            text-decoration: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="loading-container">

        <div class="loading-icon">
            <i class="bi bi-cup-hot-fill"></i>
        </div>

        <h1 class="loading-title">
            Kedai Kopi
        </h1>

        <p class="loading-description" id="loadingMessage">
            Sedang memeriksa sesi pengguna...
        </p>

        <div class="loading-spinner" id="loadingSpinner"></div>

        <div class="loading-error" id="loadingError">

            <p>
                Tidak dapat terhubung ke server.
                Pastikan backend sedang berjalan.
            </p>

            <a href="pages/login.html">
                Buka halaman login
            </a>

            <button
                type="button"
                class="btn btn-sm btn-outline-secondary d-block mx-auto mt-3"
                onclick="window.location.reload()"
            >
                Coba Lagi
            </button>

        </div>

    </main>

    <!-- API Configuration -->
    <script src="js/config/apiConfig.js"></script>

    <!-- API Service -->
    <script src="js/services/apiService.js"></script>

    <!-- Authentication Service -->
    <script src="js/services/authService.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {

            const loadingMessage = document.getElementById("loadingMessage");
            const loadingSpinner = document.getElementById("loadingSpinner");
            const loadingError = document.getElementById("loadingError");

            try {

                const response = await AuthService.checkAuth();

                if (response && response.authenticated) {

                    loadingMessage.textContent = "Sesi ditemukan. Mengalihkan ke dashboard...";

                    window.location.replace("pages/dashboard.html");

                } else {

                    loadingMessage.textContent = "Silakan login untuk melanjutkan...";

                    window.location.replace("pages/login.html");

                }

            } catch (error) {

                console.error("Gagal memeriksa autentikasi:", error);

                loadingMessage.textContent = "Terjadi masalah saat menghubungi server.";

                loadingSpinner.style.display = "none";
                loadingError.style.display = "block";

            }

        });
    </script>

</body>
</html>
